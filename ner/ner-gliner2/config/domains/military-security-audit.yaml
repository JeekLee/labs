    - {name: 비고, dtype: str, description_ko: "비고 칸의 자유 서술"}
  incident:
    - {name: 유형, dtype: str, choices: [저장매체 무단 반출, 비인가 출입, 비밀문서 관리 소홀, 계정·권한 관리 위반, 보안교육 미이수, 인가 만료자 접근], description_ko: "사고 유형"}
    - {name: 관련자, dtype: list, description_ko: "사고에 관련된 사람"}
