  finding:
    - {name: 영역, dtype: str, choices: [인원보안, 문서보안, 시설보안, 정보통신보안], description_ko: "발견 사항의 보안 영역"}
    - {name: 대상, dtype: list, description_ko: "발견 사항의 대상(사람, 직책, 시설, 문서, 매체, 정보체계)"}
    - {name: 위반 규정, dtype: list, description_ko: "위반한 규정"}
  action:
    - {name: 조치 유형, dtype: str, choices: [재교육, 매체 회수, 권한 회수, 시설 보완, 징계 의뢰, 규정 개정], description_ko: "조치의 유형"}
    - {name: 담당, dtype: list, description_ko: "조치를 맡은 사람이나 부대"}
    - {name: 기한, dtype: str, description_ko: "조치 기한"}
