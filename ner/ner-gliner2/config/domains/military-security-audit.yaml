    - {name: 반출입 일시, dtype: str, description_ko: "반출하거나 반입한 일시"}
    - {name: 구분, dtype: str, choices: [반출, 반입], description_ko: "반출인지 반입인지"}
    - {name: 확인자, dtype: list, description_ko: "기록 내용을 확인하고 서명한 사람"}
    - {name: 관리책임자, dtype: list, description_ko: "대장이나 구역의 관리를 책임지는 사람"}
    - {name: 비고, dtype: str, description_ko: "비고 칸의 자유 서술"}
  system_entry:
    - {name: 소속, dtype: list, description_ko: "정보시스템을 쓰는 부대나 부서"}
    - {name: 취급자, dtype: list, description_ko: "정보시스템을 취급하는 사람"}
